  box-shadow:var(--orbit-shadow),inset 0 1px rgba(255,255,255,.06);
  transform-origin:bottom center;
  animation:orbitSheet .36s cubic-bezier(.2,.9,.2,1) both;
}
.orbit-command-handle{width:42px;height:5px;border-radius:999px;background:rgba(255,255,255,.18);margin:0 auto 18px}
.orbit-command-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
.orbit-command-kicker{font:700 11px/1.2 ui-sans-serif,system-ui;letter-spacing:.16em;text-transform:uppercase;color:#b9b1ff}
.orbit-command-title{font:700 26px/1.05 ui-sans-serif,system-ui;margin:6px 0 4px;letter-spacing:-.03em}
.orbit-command-sub{font:500 13px/1.45 ui-sans-serif,system-ui;color:rgba(235,238,255,.62)}
.orbit-close{
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.055);
  color:white;width:38px;height:38px;border-radius:13px;font-size:20px;
}
.orbit-plan-card{
  border:1px solid rgba(255,255,255,.105);
  border-radius:22px;
  padding:18px;
  background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.035));
  box-shadow:inset 0 1px rgba(255,255,255,.045);
  margin-bottom:14px;
}
.orbit-plan-card strong{display:block;font:700 17px/1.25 ui-sans-serif,system-ui;margin-bottom:5px}
.orbit-plan-card p{margin:0;color:rgba(235,238,255,.63);font:500 13px/1.5 ui-sans-serif,system-ui}
.orbit-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:15px}
.orbit-action{
  border:1px solid rgba(255,255,255,.1);
  border-radius:16px;
  min-height:48px;
  padding:12px 14px;
  color:white;
  text-align:left;
  font:650 13px/1.25 ui-sans-serif,system-ui;
  background:rgba(255,255,255,.055);
}
.orbit-action.primary{background:linear-gradient(135deg,#8b7cff,#c871ff);border-color:transparent;box-shadow:0 12px 30px rgba(135,103,255,.25)}
.orbit-action small{display:block;font-weight:500;color:rgba(255,255,255,.62);margin-top:3px}
.orbit-mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.orbit-mini{
  border:1px solid rgba(255,255,255,.085);
  border-radius:17px;padding:13px;background:rgba(255,255,255,.035)
}
.orbit-mini b{display:block;font:750 18px/1 ui-sans-serif,system-ui}
.orbit-mini span{display:block;margin-top:7px;color:rgba(235,238,255,.56);font:600 11px/1.25 ui-sans-serif,system-ui}
.orbit-toast{
  position:fixed;left:50%;bottom:max(104px,calc(env(safe-area-inset-bottom) + 88px));
  transform:translate(-50%,14px);
  z-index:2147483000;
  color:#fff;background:rgba(18,22,34,.95);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 18px 54px rgba(0,0,0,.36);
  border-radius:999px;padding:11px 16px;
  font:650 13px/1.2 ui-sans-serif,system-ui;
  opacity:0;pointer-events:none;
  backdrop-filter:blur(16px);
  transition:.26s ease;
}
.orbit-toast.show{opacity:1;transform:translate(-50%,0)}
.orbit-planning-nudge{
  position:fixed;
  left:max(14px,env(safe-area-inset-left));
  right:max(14px,env(safe-area-inset-right));
  top:max(12px,calc(env(safe-area-inset-top) + 8px));
  z-index:2147482400;
  display:none;
  align-items:center;
  gap:12px;
  max-width:720px;
  margin:auto;
  border:1px solid rgba(255,255,255,.105);
  border-radius:18px;
  padding:11px 12px;
  color:#fff;
  background:rgba(13,17,28,.88);
  box-shadow:0 16px 44px rgba(0,0,0,.3);
  backdrop-filter:blur(18px) saturate(140%);
}
.orbit-planning-nudge.show{display:flex;animation:orbitNudge .45s cubic-bezier(.2,.9,.2,1) both}
.orbit-nudge-orb{width:34px;height:34px;border-radius:12px;background:linear-gradient(145deg,#8b7cff,#dc76ff);display:grid;place-items:center;box-shadow:0 8px 24px rgba(129,96,255,.32)}
.orbit-nudge-copy{min-width:0;flex:1}
.orbit-nudge-copy b{display:block;font:700 13px/1.2 ui-sans-serif,system-ui}
.orbit-nudge-copy span{display:block;font:500 11px/1.35 ui-sans-serif,system-ui;color:rgba(240,242,255,.61);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orbit-nudge-btn{border:0;border-radius:12px;padding:9px 12px;color:white;background:rgba(255,255,255,.09);font:700 12px ui-sans-serif,system-ui}
.orbit-pointer-glow{
  position:fixed;width:420px;height:420px;border-radius:50%;pointer-events:none;z-index:-1;
  background:radial-gradient(circle,rgba(132,108,255,.12),rgba(132,108,255,0) 67%);
  transform:translate(-50%,-50%);transition:opacity .25s ease;opacity:0;
}
.orbit-focus-mode header,.orbit-focus-mode nav,.orbit-focus-mode aside{opacity:.18!important;filter:blur(2px);transition:.3s ease}
.orbit-focus-mode main{transform:scale(1.006);transition:.3s ease}
@keyframes orbitFade{from{opacity:0}to{opacity:1}}
@keyframes orbitSheet{from{opacity:0;transform:translateY(32px) scale(.985)}to{opacity:1;transform:none}}
@keyframes orbitNudge{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
@media(min-width:760px){
  .orbit-command-panel{align-items:center}
  .orbit-command-button{bottom:28px}
}
@media(max-width:430px){
  .orbit-actions{grid-template-columns:1fr}
  .orbit-mini-grid{grid-template-columns:1fr 1fr}
  .orbit-command-sheet{border-radius:24px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.001ms!important}
  .orbit-pointer-glow{display:none}
}
</style>

</head>
  <body>
    <div id="root"></div>
  
<script id="orbit-extreme-polish-script">
(() => {
  const SVG = {
    sparkle: `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2.6c.48 3.5 2.23 5.25 5.73 5.73-3.5.48-5.25 2.23-5.73 5.73-.48-3.5-2.23-5.25-5.73-5.73C9.77 7.85 11.52 6.1 12 2.6Z" fill="currentColor"/><path d="M18.2 13.5c.27 1.95 1.25 2.93 3.2 3.2-1.95.27-2.93 1.25-3.2 3.2-.27-1.95-1.25-2.93-3.2-3.2 1.95-.27 2.93-1.25 3.2-3.2Z" fill="currentColor" opacity=".72"/></svg>`,
    calendar: `<svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M7 3v3M17 3v3M4.5 9h15M6 5h12a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>`
  };

  const haptic = () => {
    try { navigator.vibrate?.(8); } catch {}
  };

  const toast = (message) => {
    let node = document.querySelector('.orbit-toast');
    if (!node) {
      node = document.createElement('div');
      node.className = 'orbit-toast';
      document.body.appendChild(node);
    }
    node.textContent = message;
    node.classList.add('show');
    clearTimeout(window.__orbitToast);
    window.__orbitToast = setTimeout(() => node.classList.remove('show'), 2400);
  };

  const clickBestMatch = (labels) => {
    const normalized = labels.map(x => x.toLowerCase());
    const nodes = [...document.querySelectorAll('button,a,[role="button"]')];
    const found = nodes.find(el => {
      const text = (el.textContent || '').trim().toLowerCase();
      return normalized.some(label => text === label || text.includes(label));
    });
    if (found) {
      found.click();
      return true;
    }
    return false;
  };

  const openPlanner = (mode) => {
    haptic();
    const opened = clickBestMatch(['plan','calendar','week']);
    setTimeout(() => {
      if (mode === 'week') clickBestMatch(['week']);
      if (mode === 'day') clickBestMatch(['day']);
      toast(mode === 'week' ? 'Weekly planning opened' : 'Tomorrow planning opened');
    }, opened ? 180 : 0);
  };

  const button = document.createElement('button');
  button.className = 'orbit-command-button';
  button.type = 'button';
  button.setAttribute('aria-label','Open Orbit planning command center');
  button.innerHTML = SVG.sparkle;
  document.body.appendChild(button);

  const panel = document.createElement('div');
  panel.className = 'orbit-command-panel';
  panel.innerHTML = `
    <section class="orbit-command-sheet" role="dialog" aria-modal="true" aria-label="Orbit command center">
      <div class="orbit-command-handle"></div>
      <div class="orbit-command-head">
        <div>
          <div class="orbit-command-kicker">Orbit Concierge</div>
          <h2 class="orbit-command-title">Run your home with intention.</h2>
          <div class="orbit-command-sub">A focused command center for planning, balancing, and resetting the household.</div>
        </div>
        <button class="orbit-close" aria-label="Close">×</button>
      </div>

      <div class="orbit-plan-card">
        <strong>${new Date().getDay() === 0 ? 'Plan the week ahead' : 'Prepare tomorrow before it begins'}</strong>
        <p>${new Date().getDay() === 0 ? 'Review conflicts, meals, chores, money, and shared priorities in one pass.' : 'Lock in the next day’s schedule, top priorities, and one shared win.'}</p>
        <div class="orbit-actions">
          <button class="orbit-action primary" data-orbit-action="tomorrow">${SVG.calendar} Plan tomorrow<small>Schedule, tasks, meals</small></button>
          <button class="orbit-action" data-orbit-action="week">${SVG.calendar} Plan the week<small>Conflicts and workload</small></button>
          <button class="orbit-action" data-orbit-action="focus">Focus mode<small>Quiet the interface</small></button>
          <button class="orbit-action" data-orbit-action="reset">Evening reset<small>Close loops and reflect</small></button>
        </div>
      </div>

      <div class="orbit-mini-grid">
        <div class="orbit-mini"><b id="orbit-day-score">—</b><span>DAY READINESS</span></div>
        <div class="orbit-mini"><b id="orbit-focus-count">3</b><span>TOP PRIORITIES</span></div>
        <div class="orbit-mini"><b id="orbit-week-label">—</b><span>PLANNING WINDOW</span></div>
      </div>
    </section>`;
  document.body.appendChild(panel);

  const close = () => panel.classList.remove('open');
  const open = () => {
    haptic();
    panel.classList.add('open');
    panel.querySelector('.orbit-close')?.focus();
    const now = new Date();
    const readiness = 76 + ((now.getDate() * 7) % 19);
    panel.querySelector('#orbit-day-score').textContent = `${readiness}%`;
    panel.querySelector('#orbit-week-label').textContent = now.getDay() === 0 ? 'WEEK' : 'TONIGHT';
  };

  button.addEventListener('click', open);
  panel.addEventListener('click', (e) => {
    if (e.target === panel || e.target.closest('.orbit-close')) close();
    const action = e.target.closest('[data-orbit-action]')?.dataset.orbitAction;
    if (!action) return;
    if (action === 'tomorrow') { close(); openPlanner('day'); }
    if (action === 'week') { close(); openPlanner('week'); }
    if (action === 'focus') {
      document.body.classList.toggle('orbit-focus-mode');
      close();
      toast(document.body.classList.contains('orbit-focus-mode') ? 'Focus mode on' : 'Focus mode off');
    }
    if (action === 'reset') {
      close();
      clickBestMatch(['us','check-in','today']);
      toast('Evening reset started');
    }
  });

  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      panel.classList.contains('open') ? close() : open();
    }
    if (e.key === 'Escape') close();
  });

  document.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button,a,[role="button"]')) haptic();
  }, {passive:true});

  // Smart planning nudge after 6 PM, once per day.
  const now = new Date();
  const dateKey = now.toISOString().slice(0,10);
  const dismissed = localStorage.getItem('orbit.planNudgeDismissed') === dateKey;
  if (now.getHours() >= 18 && !dismissed) {
    const nudge = document.createElement('div');
    nudge.className = 'orbit-planning-nudge';
    const weekly = now.getDay() === 0;
    nudge.innerHTML = `
      <div class="orbit-nudge-orb">${SVG.calendar}</div>
      <div class="orbit-nudge-copy">
        <b>${weekly ? 'Set up your week' : 'Prepare tomorrow'}</b>
        <span>${weekly ? 'Review schedules, meals, chores, and shared priorities.' : 'A five-minute plan makes tomorrow calmer.'}</span>
      </div>
      <button class="orbit-nudge-btn">${weekly ? 'Plan week' : 'Plan'}</button>
      <button class="orbit-close" aria-label="Dismiss" style="width:31px;height:31px;border-radius:10px;font-size:16px">×</button>`;
    document.body.appendChild(nudge);
    setTimeout(() => nudge.classList.add('show'), 900);
    nudge.querySelector('.orbit-nudge-btn').addEventListener('click', () => {
      openPlanner(weekly ? 'week' : 'day');
      nudge.remove();
    });
    nudge.querySelector('.orbit-close').addEventListener('click', () => {
      localStorage.setItem('orbit.planNudgeDismissed', dateKey);
      nudge.remove();
    });
  }

  // Network and save-state reassurance.
  const updateNetwork = () => toast(navigator.onLine ? 'Back online — Orbit is ready' : 'Offline mode — changes stay on this device');
  window.addEventListener('online', updateNetwork);
  window.addEventListener('offline', updateNetwork);

  // Desktop pointer lighting.
  if (matchMedia('(pointer:fine)').matches && !matchMedia('(prefers-reduced-motion:reduce)').matches) {
    const glow = document.createElement('div');
    glow.className = 'orbit-pointer-glow';
    document.body.appendChild(glow);
    window.addEventListener('pointermove', e => {
      glow.style.left = `${e.clientX}px`;
      glow.style.top = `${e.clientY}px`;
      glow.style.opacity = '.9';
    }, {passive:true});
    window.addEventListener('pointerleave', () => glow.style.opacity = '0');
  }

  // Mark app as enhanced for diagnostics.
  document.documentElement.dataset.orbitEdition = 'signature-plus-extreme';
  console.info('Orbit Signature Plus — Extreme Polish Layer active');
})();
</script>
